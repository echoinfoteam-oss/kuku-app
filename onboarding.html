<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { margin: 0; background: transparent; display: flex; justify-content: flex-start; align-items: center; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #wrapper { display: flex; align-items: center; gap: 15px; -webkit-app-region: drag; }
    #video-container { width: 320px; height: 200px; background: #000; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 15px 50px rgba(29, 185, 84, 0.5); overflow: hidden; position: relative; flex-shrink: 0; animation: slideIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    
    #badge { display: none; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); padding: 12px 16px; border-radius: 12px; color: #ccc; font-size: 12px; max-width: 160px; line-height: 1.4; backdrop-filter: blur(10px); animation: popIn 0.5s 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; opacity: 0; }
    #badge.active { display: block; }
    #badge strong { color: #1DB954; display: block; margin-bottom: 4px; }

    @keyframes slideIn { from { transform: scale(0.8) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
    @keyframes popIn { from { transform: scale(0.8) translateX(-10px); opacity: 0; } to { transform: scale(1) translateX(0); opacity: 1; } }

    video { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; }
    .overlay { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.8)); padding: 10px; color: white; font-size: 11px; text-align: center; pointer-events: none; font-weight: bold; letter-spacing: 0.5px; }
    .skip-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: white; border: none; padding: 5px 10px; border-radius: 8px; font-size: 10px; cursor: pointer; -webkit-app-region: no-drag; transition: 0.2s; }
    .skip-btn:hover { background: rgba(29, 185, 84, 0.8); }
  </style>
</head>
<body>

  <div id="wrapper">
    <div id="video-container">
      <video id="onboarding-video" autoplay></video>
      <div class="overlay" id="overlay-text">Welcome to KUKU</div>
      <button class="skip-btn" onclick="skipVideo()">Skip</button>
    </div>
    <div id="badge">
      <strong>📢 Hey there!</strong>
      Sorry our CEO yaps a lot. This one is a bit longer, bear with us!
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const video = document.getElementById('onboarding-video');
    const overlayText = document.getElementById('overlay-text');
    const badge = document.getElementById('badge');

    ipcRenderer.on('play-video', (event, data) => {
      video.src = data.src;
      overlayText.innerText = data.title;
      if (data.showBadge) badge.classList.add('active');
      video.play();
    });

    video.onended = () => { ipcRenderer.send('video-finished'); };
    video.onerror = () => { overlayText.innerText = "Video not found. Skipping..."; setTimeout(() => ipcRenderer.send('video-finished'), 2000); };
    function skipVideo() { ipcRenderer.send('video-finished'); }
  </script>
</body>
</html>
