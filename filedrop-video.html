<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #video-container {
      width: 380px;
      height: 240px;
      background: #000;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 60px rgba(255, 255, 255, 0.15);
      overflow: hidden;
      position: relative;
      animation: slideIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes slideIn {
      from { transform: scale(0.85) translateY(20px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 18px;
    }
    .overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      padding: 12px;
      color: white;
      font-size: 12px;
      text-align: center;
      font-weight: 600;
      letter-spacing: 0.5px;
      pointer-events: none;
    }
    .skip-btn {
      position: absolute;
      top: 10px; right: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 10px;
      cursor: pointer;
      transition: 0.2s;
      font-weight: 600;
      -webkit-app-region: no-drag;
    }
    .skip-btn:hover { background: rgba(255, 255, 255, 0.2); }
    .progress-bar {
      position: absolute;
      bottom: 0; left: 0;
      height: 3px;
      background: white;
      box-shadow: 0 0 10px rgba(255,255,255,0.8);
      transition: width 0.2s linear;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="filedrop-video" autoplay></video>
    <div class="overlay" id="overlay-text">Here's how file analysis works ✨</div>
    <button class="skip-btn" onclick="skipVideo()">Skip →</button>
    <div class="progress-bar" id="progress" style="width: 0%"></div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    const video = document.getElementById('filedrop-video');
    const progress = document.getElementById('progress');
    const overlayText = document.getElementById('overlay-text');

    // 🔥 SAME PATTERN AS onboarding.html — wait for the play event
    ipcRenderer.on('play-filedrop-video', () => {
      console.log('🎬 Received play-filedrop-video event');
      video.src = 'filedrop_intro.mp4';
      
      // Try to play
      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          console.log('✅ Video is playing');
        }).catch(err => {
          console.log('⚠️ Video play failed:', err);
          // If autoplay is blocked or file missing, continue after 1.5s
          setTimeout(() => ipcRenderer.send('filedrop-video-finished'), 1500);
        });
      }
    });

    video.addEventListener('timeupdate', () => {
      if (video.duration) {
        progress.style.width = (video.currentTime / video.duration * 100) + '%';
      }
    });

    video.addEventListener('loadedmetadata', () => {
      console.log('📹 Video metadata loaded, duration:', video.duration);
    });

    video.onended = () => {
      console.log('✅ Video ended');
      ipcRenderer.send('filedrop-video-finished');
    };

    video.onerror = (e) => {
      console.log('❌ Video error:', e);
      overlayText.innerText = "Video not found. Continuing...";
      setTimeout(() => ipcRenderer.send('filedrop-video-finished'), 1500);
    };

    function skipVideo() {
      console.log('⏭️ Skip clicked');
      ipcRenderer.send('filedrop-video-finished');
    }
  </script>
</body>
</html>
